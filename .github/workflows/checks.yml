name: Stage checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # Day 2 platform exception. Revisit the SRS portability check in later stages.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test and verify the live health endpoint
        run: python tools/local_check.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/brain.py
      - run: python tools/check_skills.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable Git history
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git --no-banner --redact --log-opts=--all /repo
